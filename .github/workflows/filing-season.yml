name: Filing season (사업·반기보고서 공시일 자동 반영, no LLM)

# 증권사 사업보고서는 3월(법정 기한 3/31, 비상장 증권사 감사보고서는 4월까지), 반기보고서는 8월(기한 8/14)에 올라온다.
# 이 기간에는 매일 아침 DART 공시 목록만 확인하고(가벼움), 새 보고서가 있을 때만 원문을 받아
# 해외법인 5개년 손익 추이·법인 목록·ROE·한화 탭 공시 요약을 다시 만든다. 그 밖의 기간은 매주 update-data.yml이 확인한다.
on:
  schedule:
    - cron: "0 22 * 3,4,8 *"   # 3·4·8월 매일 07:00 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 새 사업·반기보고서 확인 → 해외법인 5개년 손익 추이
        id: trend
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_sub_trend.py
      # 새 보고서가 있으면 해외법인·재무·ROE도 다시 수집(한 단계가 실패해도 나머지는 돈다)
      - name: 해외법인·재무·공시 (DART, 주간 변화는 지난 주간 수집 대비 유지)
        if: steps.trend.outputs.new_reports == 'true'
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_dart.py --midweek
      - name: 종속회사 전수 목록 (DART)
        if: steps.trend.outputs.new_reports == 'true'
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_consolidated.py
      - name: 해외 종속기업 요약재무·ROE (DART)
        if: steps.trend.outputs.new_reports == 'true'
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_sub_fin.py
      - name: 5개년 손익 추이 다시 만들기 (받은 원문으로, 새 법인 목록 반영)
        if: steps.trend.outputs.new_reports == 'true'
        continue-on-error: true
        run: python scripts/fetch_sub_trend.py --rebuild
      - name: 한화 탭 해외자회사 공시 요약 (DART)
        if: steps.trend.outputs.new_reports == 'true' && hashFiles('hanwha/scripts/fetch_dart_subs.py') != ''
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python hanwha/scripts/fetch_dart_subs.py
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Commit data
        id: commit
        run: |
          git config user.name "gnd-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if [ -d hanwha/data ]; then git add hanwha/data; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: filing season check $(date -u +%F)"
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
