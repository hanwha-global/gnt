name: Overseas-entry guide daily check (no LLM)

on:
  schedule:
    - cron: "10 22 * * *"   # 매일 07:10 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: guide-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 감독당국 공식 발표 자동 감지 (국가별 진입 규제)
        continue-on-error: true
        run: python guide/scripts/detect_entry_rules.py
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Commit data
        id: commit
        run: |
          git config user.name "gnd-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: overseas-entry guide check $(date -u +%F)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
