name: Weekly data update (DART · SEC, no LLM)

# 임시: PR 브랜치에서 전체 증권사 순위 파일만 한 번 만든다(다음 커밋에서 원래대로 되돌림)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 국내 전체 증권사 자기자본 순위
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/broker_rank.py
      - name: Commit
        run: |
          git config user.name "gnd-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/domestic/broker_rank.json
          git diff --cached --quiet || { git commit -m "data: 국내 전체 증권사 자기자본 순위 첫 수집"; git push; }
