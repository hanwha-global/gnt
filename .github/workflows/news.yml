name: Daily news (국내 증권사 해외진출, no LLM)

on:
  schedule:
    - cron: "30 21 * * *"   # 매일 06:30 KST
    - cron: "30 3 * * 1-5"  # 평일 12:30 KST
    - cron: "30 8 * * 1-5"  # 평일 17:30 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 임시 조사(원자료 덤프)
        run: python scripts/probe_news.py
      - name: Commit
        id: commit
        run: |
          git config user.name "gnd-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _probe/raw.json
          git commit -m "probe: raw news $(date -u +%FT%H:%M)"
          git push
          echo "changed=false" >> "$GITHUB_OUTPUT"
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
