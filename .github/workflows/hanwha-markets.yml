name: Hanwha daily (DART disclosures · rates · indices · FX, no LLM)

on:
  schedule:
    - cron: "30 22 * * 0-4"   # 평일 07:30 KST (미국·유럽 마감 반영)
    - cron: "30 7 * * 1-5"    # 평일 16:30 KST (아시아 마감, 당일 DART 공시 반영)
  workflow_dispatch:
  pull_request:
    paths:
      - hanwha/scripts/fetch_markets.py
      - hanwha/scripts/build_rate_calendar.py
      - hanwha/scripts/fetch_dart_subs.py
      - hanwha/scripts/build_deadlines.py
      - hanwha/scripts/build_downloads.py
      - .github/workflows/hanwha-markets.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: hanwha-markets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  markets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 금리·지수·환율 수집
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python hanwha/scripts/fetch_markets.py
      - name: 해외자회사 공시 실적·출자 현황 (DART 정기보고서)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python hanwha/scripts/fetch_dart_subs.py
      - name: 대외보고 기한 (공시 접수 반영)
        continue-on-error: true
        run: python hanwha/scripts/build_deadlines.py
      - name: 금리 결정 일정 (중앙은행 공식 페이지)
        continue-on-error: true
        run: python hanwha/scripts/build_rate_calendar.py
      # 엑셀·1장 보고서는 공시 기준(보고서·출자내역·만드는 스크립트)이 바뀐 날만 다시 만든다. PR에서는 항상 만들어 본다.
      - name: 다운로드 기준 확인
        id: dl
        if: hashFiles('hanwha/scripts/build_downloads.py') != ''
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else python hanwha/scripts/build_downloads.py --check >> "$GITHUB_OUTPUT"; fi
      # 예약 실행에서는 다운로드가 실패해도 시장·공시 데이터 커밋을 계속한다(기준이 안 바뀌어 다음 실행에서 다시 만든다). PR에서는 실패로 드러낸다.
      - name: 다운로드 도구 설치
        id: dltools
        if: steps.dl.outputs.rebuild == 'true'
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          pip install -q xlsxwriter python-docx
          sudo rm -f /var/lib/man-db/auto-update   # man 색인 갱신을 건너뛰어 설치 시간을 줄인다
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui fonts-noto-cjk
      - name: 엑셀·1장 보고서 재생성
        id: dlbuild
        if: steps.dl.outputs.rebuild == 'true' && steps.dltools.outcome == 'success'
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python hanwha/scripts/build_downloads.py
      - name: 결과 요약 (PR 점검용)
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open("hanwha/data/markets.json", encoding="utf-8"))
          print("updated", d.get("updated"))
          for x in d.get("indices", []):
              print("IDX", x["name"], x.get("symbol"), x.get("date"), x.get("close"), x.get("chg"))
          print("DXY months", len(d.get("dxy_monthly", [])))
          for r in d.get("fx", {}).get("rows", []):
              print("FX", r)
          for r in d.get("policy", {}).get("table", []):
              print("POL", r)
          c = json.load(open("hanwha/data/rate_calendar.json", encoding="utf-8"))
          print("CAL", c.get("banks"))
          s = json.load(open("hanwha/data/dart_subs.json", encoding="utf-8"))
          print("DART_SUBS_JSON_BEGIN")
          print(json.dumps(s, ensure_ascii=False))
          print("DART_SUBS_JSON_END")
          r = json.load(open("hanwha/data/regulatory.json", encoding="utf-8"))
          for t in r.get("todo", [])[:8]:
              print("TODO", t["id"], t.get("due"), t["status"], t.get("note", ""))
          if os.path.isdir("hanwha/downloads"):
              print("DL", sorted(os.listdir("hanwha/downloads")))
          PY
      - name: 변경분 커밋 후 사이트 재배포
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "gnd-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 다운로드를 끝까지 못 만들었으면 반쯤 바뀐 파일을 되돌려 직전 기간 세트를 그대로 둔다
          if [ "${{ steps.dlbuild.outcome }}" = "failure" ]; then git checkout -- 'hanwha/downloads/해외자회사_*'; fi
          git add hanwha/data/markets.json hanwha/data/rate_calendar.json hanwha/data/dart_subs.json hanwha/data/regulatory.json hanwha/downloads
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: hanwha $(TZ=Asia/Seoul date +'%F %H:%M')"
          git pull --rebase origin main && git push
          gh workflow run pages.yml --ref main
