name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (수집 규칙·파이프라인)
        run: python -m unittest discover -s tests -v
      - name: 미국 순위 수집 (SEC, 키 불필요)
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: python scripts/update_sec.py
      - name: 미국 진출 Velocity Clearing 수집 (FINRA BrokerCheck·SEC EDGAR·한화생명 DART·뉴스)
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}   # 한화생명 정기보고서(미국 법인 손익·출자). 없으면 그 부분만 이전 값
        run: |
          pip install --quiet pypdf==6.17.0
          python workflow/scripts/fetch_velocity.py
      - name: Build site
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
